spring:
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    locale: vi_VN
  application:
    name: WalletCentral

  # 1. Kích hoạt Virtual Threads cho Tomcat & Async Task
  threads:
    virtual:
      enabled: true

  # 2. Cấu hình kết nối Cơ sở dữ liệu dung chung
  datasource:
    url: jdbc:mariadb://172.16.10.188:3306/walletcentral
    username: root
    password: akuo-kfo
    driver-class-name: org.mariadb.jdbc.Driver

  # 3. Cấu hình SQL initialization
#  sql:
#    init:
#      mode: always
#      schema-locations: classpath:schema.sql

  # 4. Cấu hình JPA/Hibernate
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none  # Tắt Hibernate DDL - dùng schema.sql
    defer-datasource-initialization: true  # Chạy SQL script trước
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

  # 5. Cấu hình Hàng Đợi RabbitMQ (Xử lý bất đồng bộ giao dịch)
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 5
        max-concurrency: 20
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0

  # 6. SpringDoc OpenAPI
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
      tags-sorter: alpha
      operations-sorter: alpha
    api-docs:
      path: /v3/api-docs
    packages-to-scan: com.gateway.walletcentral.modules.*.controller

# Application custom config
app:
  mail:
    host: smtp.gmail.com
    port: 587

# ============================================================
# Encryption - Master password for ENC() values
# Priority: JVM arg (-D) > Env var > Property below
# Dev: có thể hardcode tại đây (KHÔNG commit password thật lên git)
# Production: dùng -Dencryption.master-password=xxx hoặc env var
# ============================================================
encryption:
  master-password: ${ENCRYPTION_MASTER_PASSWORD:dev-only-master-key}

